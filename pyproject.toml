[project]
name = "marketing-content-pipeline"
version = "0.1.0"
description = "Dataset-guided AI framework for platform-specific marketing content generation, engagement prediction, and adaptive optimization."
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "slow: takes more than a few seconds (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
